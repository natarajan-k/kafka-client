## Mandatory Section ##
# Set to true if avro schema is enabled for the topic
enableschemaavro = false
# Set to true if want to enable Intercept Monitoring.
enableintercept = false
# Set this to true if mTLS (2-way TLS authentication) is enabled for Kafka.
enablemtls = false
# Set this to true if mTLS (2-way TLS authentication) is enabled for Schema Registry.
enableschemamtls = false
# Broker related properties
bootstrap.servers = <BOOTSTRAP_SERVER:PORT>
sasl.jaas.config = org.apache.kafka.common.security.scram.ScramLoginModule required username='<SCRAM_USER>' password='<SCRAM_USER_PASSWORD>';
# Example (Plain): sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username='PLAIN' password='PASSWORD';
# Example (Scram): sasl.jaas.config = org.apache.kafka.common.security.scram.ScramLoginModule required username='student01' password='PASSWORD';
# Example (OAuth): sasl.jaas.config = org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
# Options are PLAIN, SCRAM-SHA-512, GSSAPI, OAUTHBEARER
sasl.mechanism=SCRAM-SHA-512
# Options are SSL, PLAINTEXT, SASL_SSL, SASL_PLAINTEXT
security.protocol=SASL_SSL
# To enable hostname verification. Options are HTTPS or blank.
ssl.endpoint.identification.algorithm=HTTPS
topic=<TOPIC NAME>
# Consumer Group ID
group.id = <GROUP ID>
# Example: group.id = student01-group
# Producer / Consumer Client ID
producer.client.id=my-producer
consumer.client.id=302071b2-7daf-4844
#--------------------------------
## To be filled in if TLS is enabled for the Brokers
# Options are PKCS12, JKS, PEM. Password not required for PEM.
ssl.truststore.type=PKCS12
ssl.truststore.location=<LOCATION OF TRUSTSTORE DOWNLOADED>
ssl.truststore.password=<TRUSTSTORE_PASSWORD>
#--------------------------------
## To be filled if mTLS (Mutual TLS) is enabled in Brokers
ssl.keystore.location=<LOCATION OF KEYSTORE DOWNLOADED>
ssl.keystore.password=<KEYSTORE_PASSWORD>
ssl.key.password=<KEYSTORE_PASSWORD>
#-------------------------------
## To be filled in OauthBearer is used for sasl.mechanism.
oauth.client.id=<CLIENT-ID>
oauth.client.secret=<CLIENT-SECRET>
oauth.token.endpointurl=<IdP-TOKEN-URL>
#--------------------------------
## To be filled if the IdP has TLS enabled.
## Options are PKCS12 or JKS
oauth.truststore.type=JKS
oauth.truststore.location=<LOCATION OF JKS CERT of IdP>
oauth.truststore.password=<IdP_TRUSTSTORE_PASSWORD>
#--------------------------------
## To be filled in if Schema is enabled
# Schema Registry Type (Options are confluent or apicurio.)
schema.registry.type = confluent
schema.registry.url = <SCHEMA_REGISTRY_URL>
# To push globalID in header. Needed for Apicurio AVRO messages to work with EP. 
apicurio.schema.header = false
# To be set to true if schema is not created up front.
auto.register.schemas=false
## To be filled in if Schema Registry requires Authentication.
# TYpe of Authentication for Schema. Optins are USER_INFO or OAUTHBEARER
schema.auth.credentials.source = <TYPE>
# Enter username / password for BASIC Auth or Client-ID/Secret for OAUTHBEARER
schema.auth.user = <CLIENT-ID or USERNAME>
schema.auth.secret = <CLIENT-SECRET or PASSWORD>
#--------------------------------
## To be filled in if TLS is enabled for Schema Registry
## Options are PKCS12 or JKS
schema.registry.ssl.truststore.type=JKS
schema.registry.ssl.truststore.location=<LOCATION OF TRUSTSTORE DOWNLOADED>
schema.registry.ssl.truststore.password=<TRUSTSTORE_PASSWORD>
#--------------------------------
## To be filled if connection to Schema Registry requires mTLS
schema.registry.ssl.keystore.type=PKCS12
schema.registry.ssl.keystore.location=<LOCATION OF PKCS12 CERT DOWNLOADED>
schema.registry.ssl.keystore.password=<KEYSTORE_PASSWORD>
#--------------------------------
## To be filled if Consumer / Producer Intercept should be turned on
intercept_bootstrapServers = es3minimal-kafka-bootstrap-es3.mycluster-rajan07-992844b4e64c83c3dbd5e7b5e2da5328-0000.jp-tok.containers.appdomain.cloud:443
intercept_sasljaas = org.apache.kafka.common.security.scram.ScramLoginModule required username='USER' password='PASSWORD';
intercept_security = SASL_SSL
intercept_saslmechanism = SCRAM-SHA-512
#--------------------------------
## To be used when Kerberos Authentication is used
sasl.kerberos.service.name=kafka
#--------------------------------
## Other Optional parameters.
retries = 2
# Time in seconds to wait before closing producer - to give time for producer to push metrics to brokers. 
waitbeforeclose = 5
